<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中英翻譯助手 | CH-EN Translator</title>
    <style>
        /* 基礎全域設定 */
        :root {
            --primary-color: #4F46E5; /* 現代靛藍色 */
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --box-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #9CA3AF;
            --border-color: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* 標題區塊 */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* 主翻譯區塊 (響應式 Grid) */
        .translator-container {
            background-color: var(--box-bg);
            width: 100%;
            max-width: 1000px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1.5rem;
            align-items: stretch;
        }

        /* 輸入與輸出區塊 */
        .text-box {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .text-box label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 250px;
            resize: none;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.5;
            transition: all 0.3s ease;
            background-color: #F9FAFB;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* 中間按鈕區 */
        .center-controls {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 按鈕樣式 */
        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-translate {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
        }

        .btn-translate:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-translate:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .action-btn {
            background: none;
            color: var(--text-muted);
            padding: 0.25rem 0.5rem;
        }

        .action-btn:hover {
            color: var(--primary-color);
            background-color: #EEF2FF;
        }

        /* 響應式設計 (手機螢幕) */
        @media (max-width: 768px) {
            .translator-container {
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 1.5rem;
            }
            .center-controls {
                flex-direction: row;
                padding: 1rem 0;
            }
            .btn-translate {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>中英翻譯助手</h1>
        <p>簡單、快速、直覺的中文轉英文工具</p>
    </header>

    <div class="translator-container">
        <!-- 左側：中文輸入 -->
        <div class="text-box">
            <label>
                <span>繁體/簡體中文</span>
                <button class="action-btn" id="clearBtn" title="清空內容">🗑️ 清空</button>
            </label>
            <textarea id="inputText" placeholder="請在此輸入想要翻譯的中文內容..."></textarea>
        </div>

        <!-- 中間：翻譯按鈕 -->
        <div class="center-controls">
            <button class="btn-translate" id="translateBtn">
                翻譯 <span>➔</span>
            </button>
        </div>

        <!-- 右側：英文輸出 -->
        <div class="text-box">
            <label>
                <span>English</span>
                <button class="action-btn" id="copyBtn" title="複製結果">📋 複製</button>
            </label>
            <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>
        </div>
    </div>

    <script>
        // 取得 DOM 元素
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const translateBtn = document.getElementById('translateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');

        // 翻譯核心功能 (使用開源的 MyMemory API 作為 Demo)
        async function translateText() {
            const text = inputText.value.trim();
            
            if (!text) {
                alert("請先輸入要翻譯的中文喔！");
                return;
            }

            // UX：改變按鈕狀態為讀取中
            translateBtn.innerHTML = '翻譯中... <span>⌛</span>';
            translateBtn.disabled = true;

            try {
                // 呼叫 API (zh-TW to en)
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh|en`);
                const data = await response.json();
                
                if(data.responseData.translatedText) {
                    outputText.value = data.responseData.translatedText;
                } else {
                    outputText.value = "翻譯發生錯誤，請稍後再試。";
                }
            } catch (error) {
                outputText.value = "網路連線異常，無法完成翻譯。";
                console.error("Translation Error: ", error);
            } finally {
                // UX：恢復按鈕狀態
                translateBtn.innerHTML = '翻譯 <span>➔</span>';
                translateBtn.disabled = false;
            }
        }

        // 清空內容功能
        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
            inputText.focus();
        });

        // 複製內容功能
        copyBtn.addEventListener('click', () => {
            if (!outputText.value) return;
            
            // 使用 Clipboard API 複製文字
            navigator.clipboard.writeText(outputText.value).then(() => {
                // UX：複製成功的小回饋
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '✅ 已複製';
                copyBtn.style.color = '#10B981'; // 轉為綠色
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                    copyBtn.style.color = '';
                }, 2000);
            }).catch(err => {
                alert('複製失敗，請手動複製。');
            });
        });

        // 綁定翻譯按鈕點擊事件
        translateBtn.addEventListener('click', translateText);

        // UX 提升：允許按下 Ctrl + Enter 快速翻譯
        inputText.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                translateText();
            }
        });
    </script>
</body>
</html>
